name: Instalador Windows

# Genera SysTurismo-1.0.0.exe en un servidor Windows de GitHub (sin instalar nada en tu PC).
# Uso: subir el proyecto a GitHub -> pestaña "Actions" -> "Instalador Windows" -> "Run workflow".
# El .exe queda en la seccion "Artifacts" de la ejecucion.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar WiX Toolset 3 (requerido por jpackage)
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generar instalador
        shell: cmd
        run: call crear-instalador.bat

      - uses: actions/upload-artifact@v4
        with:
          name: SysTurismo-instalador-windows
          path: installer/SysTurismo-1.0.0.exe
          if-no-files-found: error
